name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  github-pages:
    name: GitHub Pages compatibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build with the GitHub Pages toolchain
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          future: true
          verbose: true

  jekyll-current:
    name: Current Jekyll (pinned)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/srv/jekyll" \
            -v "${{ github.workspace }}/_site:/srv/jekyll/_site" \
            sylhare/jekyll@sha256:c03ebce9ef2aed0a43d99658f801c211330cad609e4c443eb3893c84dd347652 \
            /bin/bash -c "chmod -R 777 /srv/jekyll && jekyll build --future"
